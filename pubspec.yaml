name: cpos
description: "Chillion Point Of Sale System."
publish_to: 'none'

version: 2.0.5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  sqflite: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.2
  package_info_plus: ^10.1.0
  http: ^1.2.0
  url_launcher: ^6.3.2
  dio: ^5.9.2
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.2

flutter:
  uses-material-design: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icons/app_launcher.png"